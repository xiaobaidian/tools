<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sanfre 的工具 · 网页小工具集</title>
<meta name="description" content="Sanfre 的网页小工具统一入口，由 WorkBuddy（小微）维护。"/>
<style>
  :root{
    --bg:#ffffff;
    --section:#f5f5f7;
    --ink:#1d1d1f;
    --muted:#86868b;
    --blue:#0066cc;
    --blue-hover:#0077ed;
    --line:#d2d2d7;
    --card:#fbfbfd;
    --shadow:0 4px 24px rgba(0,0,0,.06);
    --maxw:980px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:var(--bg);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- 导航 ---------- */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    height:48px;display:flex;align-items:center;justify-content:center;gap:38px;
    background:rgba(255,255,255,.72);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(0,0,0,.08);
    font-size:13px;
  }
  .nav .brand{position:absolute;left:max(22px,calc(50% - var(--maxw)/2));font-weight:600;letter-spacing:.2px;font-size:15px}
  .nav .links{display:flex;gap:30px}
  .nav .links a{color:var(--ink);opacity:.85;transition:opacity .2s}
  .nav .links a:hover{opacity:1;color:var(--blue)}
  @media(max-width:720px){.nav .links{display:none}.nav .brand{left:22px}}

  /* ---------- Hero ---------- */
  .hero{
    padding:160px 22px 90px;
    text-align:center;
    background:linear-gradient(180deg,#fbfbfd 0%,#ffffff 100%);
  }
  .hero .eyebrow{
    font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--blue);margin-bottom:14px;
  }
  .hero h1{
    font-size:clamp(40px,6.4vw,72px);font-weight:600;letter-spacing:-.02em;line-height:1.05;
    margin-bottom:20px;
  }
  .hero .sub{
    font-size:clamp(18px,2.4vw,24px);color:var(--muted);font-weight:400;max-width:620px;margin:0 auto 34px;
  }
  .hero .cta{
    display:inline-flex;gap:26px;align-items:center;font-size:17px;
  }
  .hero .cta a{color:var(--blue)}
  .hero .cta a:hover{text-decoration:underline}
  .hero .cta .arrow{font-size:13px}

  /* ---------- 区块 ---------- */
  .catalog{max-width:var(--maxw);margin:0 auto;padding:30px 22px 60px}
  .cat{padding:64px 0;border-top:1px solid var(--line)}
  .cat:first-child{border-top:0}
  .cat-head{text-align:center;margin-bottom:44px}
  .cat-head h2{font-size:clamp(30px,4vw,44px);font-weight:600;letter-spacing:-.01em}
  .cat-head p{color:var(--muted);font-size:17px;margin-top:8px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
  .card{
    background:var(--card);border:1px solid rgba(0,0,0,.05);border-radius:20px;
    padding:42px 28px;text-align:center;
    box-shadow:var(--shadow);
    transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;
    opacity:0;transform:translateY(26px);
  }
  .card.in{opacity:1;transform:none}
  .card:hover{transform:translateY(-6px);box-shadow:0 12px 38px rgba(0,0,0,.1)}
  .card .ico{font-size:46px;line-height:1;margin-bottom:16px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.12))}
  .card h3{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
  .card .desc{color:var(--muted);font-size:14.5px;min-height:42px;margin-bottom:18px}
  .card .open{
    display:inline-flex;align-items:center;gap:5px;font-size:15px;color:var(--blue);font-weight:400;
  }
  .card .open:hover{text-decoration:underline}
  .card .open .a{transition:transform .2s}
  .card:hover .open .a{transform:translateX(3px)}

  /* ---------- Footer ---------- */
  footer{
    background:var(--section);color:var(--muted);font-size:12px;
    padding:34px 22px;text-align:center;border-top:1px solid var(--line);
  }
  footer a{color:var(--blue)}
  footer .sep{margin:0 8px;opacity:.4}

  /* 滚动渐显 stagger */
  .card.in{transition-delay:var(--d,0ms)}

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .card{opacity:1;transform:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">⌘ 工具集</div>
  <div class="links">
    <a href="#cat-mail">邮箱</a>
    <a href="#cat-image">图片</a>
    <a href="#cat-doc">文档</a>
    <a href="#cat-repo">维护</a>
    <a href="https://github.com/xiaobaidian/tools" target="_blank" rel="noopener">GitHub</a>
  </div>
</nav>

<header class="hero">
  <div class="eyebrow">Sanfre's Tools</div>
  <h1>你的网页小工具，<br/>集于一处。</h1>
  <p class="sub">所有网页小工具的统一入口。随取随用，干净清爽。</p>
  <div class="cta">
    <a href="#cat-mail">浏览工具 <span class="arrow">↓</span></a>
    <a href="https://github.com/xiaobaidian/tools" target="_blank" rel="noopener">在 GitHub 查看</a>
  </div>
</header>

<main class="catalog" id="catalog">
  <!-- 区块由 tools.json 动态生成 -->
</main>

<footer>
  <div>由 WorkBuddy（小微）维护 · 数据来自 <a href="./tools.json">tools.json</a></div>
  <div style="margin-top:6px">仓库 <a href="https://github.com/xiaobaidian/tools">github.com/xiaobaidian/tools</a><span class="sep">·</span>公开可访问</div>
</footer>

<script>
const CATEGORIES = [
  {key:"mail",  label:"邮箱管理",  sub:"收发与管理邮箱的一整套工具"},
  {key:"image", label:"图片工具",  sub:"本地处理，零依赖，保护隐私"},
  {key:"doc",   label:"文档工具",  sub:"表格与单据，一键生成"},
  {key:"repo",  label:"仓库维护",  sub:"工具集自身的维护脚本"},
];
const TYPE = {web:{label:"打开"}, tool:{label:"查看说明"}};

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function cardHtml(t,i){
  const link = "./" + t.folder + (t.type==="web" ? "/" : "/README.md");
  const lbl = (TYPE[t.type]||TYPE.tool).label;
  return `<a class="card" href="${link}" target="_blank" rel="noopener" style="--d:${i*70}ms">
    <div class="ico">${esc(t.emoji||"🧰")}</div>
    <h3>${esc(t.name)}</h3>
    <div class="desc">${esc(t.desc)||"——"}</div>
    <span class="open">${lbl} <span class="a">›</span></span>
  </a>`;
}

function render(){
  const catalog = document.getElementById("catalog");
  const groups = {};
  TOOLS.forEach(t=>{
    const c = (t.category||"其他").replace(/[📧🖼️📄🛠️]\s*/g,"").trim();
    (groups[c] = groups[c]||[]).push(t);
  });
  let html = "";
  CATEGORIES.forEach(cat=>{
    const items = groups[cat.label] || [];
    if(!items.length) return;
    html += `<section class="cat" id="cat-${cat.key}">
      <div class="cat-head"><h2>${esc(cat.label)}</h2><p>${esc(cat.sub)}</p></div>
      <div class="grid">${items.map((t,i)=>cardHtml(t,i)).join("")}</div>
    </section>`;
  });
  catalog.innerHTML = html || '<p style="text-align:center;color:var(--muted)">还没有工具～</p>';

  // 滚动渐显
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  },{threshold:.12});
  document.querySelectorAll(".card").forEach(el=>io.observe(el));
}

let TOOLS = [];
fetch("./tools.json").then(r=>r.json()).then(d=>{
  TOOLS = d.tools||[];
  render();
}).catch(e=>{
  document.getElementById("catalog").innerHTML =
    '<p style="text-align:center;color:var(--muted)">清单加载失败：'+e+'</p>';
});
</script>
</body>
</html>
